<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-label="Raihan Athallah - Computer Engineering, AI and Systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070812"/>
      <stop offset="55%" stop-color="#11132b"/>
      <stop offset="100%" stop-color="#210b2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#8b8cff" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <circle cx="1370" cy="120" r="180" fill="#7c4dff" opacity=".08"/>
  <circle cx="1430" cy="160" r="110" fill="#00e5ff" opacity=".06"/>
  <path d="M0 390 C260 315 410 455 700 365 S1160 300 1600 365" fill="none" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>
  <path d="M0 410 C300 335 450 475 730 385 S1200 320 1600 385" fill="none" stroke="#ff2bd6" stroke-opacity=".22" stroke-width="1"/>
  <g fill="none" stroke="url(#neon)" stroke-width="2" opacity=".65">
    <rect x="1210" y="70" width="100" height="100" rx="8" transform="rotate(18 1260 120)"/>
    <rect x="1325" y="210" width="54" height="54" rx="5" transform="rotate(-22 1352 237)"/>
    <path d="M1150 245 L1200 195 L1250 245 L1200 295 Z"/>
  </g>
  <g font-family="monospace" fill="#00e5ff" opacity=".75" font-size="14">
    <text x="92" y="78">RAIHAN ATHALLAH // PROFILE SYSTEM</text>
    <text x="92" y="430">AI • LOCAL COMPUTING • GENERATIVE AI • COMPUTER SYSTEMS</text>
  </g>
  <text x="88" y="210" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" fill="#ffffff">RAIHAN ATHALLAH</text>
  <text x="94" y="270" font-family="monospace" font-size="27" fill="url(#neon)">COMPUTER ENGINEERING × AI × SYSTEMS</text>
  <rect x="94" y="305" width="460" height="2" fill="url(#neon)"/>
  <text x="94" y="345" font-family="monospace" font-size="18" fill="#bfc5ff">Building, experimenting, breaking things — then learning why.</text>
</svg>